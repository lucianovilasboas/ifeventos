<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Confirmação de Presença</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body{background:#e8eef7;font-family:'Poppins',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .card-conf{background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(74,71,163,.10);max-width:440px;width:100%;padding:34px 28px;text-align:center;border:1px solid #eceef5}
        .ico{width:74px;height:74px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:16px}
        .ico.ok{background:#dcfce7;color:#16a34a}
        .ico.erro{background:#fee2e2;color:#ef4444}
        h1{font-size:20px;font-weight:800;letter-spacing:-.4px;color:#1a1d29}
        .mensagem{font-size:16px;font-weight:600;margin-top:14px}
        .msg-ok{color:#16a34a}.msg-erro{color:#ef4444}
        .linha{font-size:13px;color:#7a8396;margin-top:6px}
        .btn-app{background:linear-gradient(135deg,#6c63ff,#4a47a3);color:#fff!important;border:none;border-radius:12px;font-weight:600;padding:11px 20px;display:inline-block;margin-top:22px;text-decoration:none}
        .btn-app:hover{filter:brightness(1.05)}
    </style>
    {% include 'includes/pwa_head.html' %}
</head>
<body>
    <div class="card-conf">
        <span class="ico {% if success %}ok{% else %}erro{% endif %}">
            <i class="fa-solid {% if success %}fa-circle-check{% else %}fa-circle-xmark{% endif %}"></i>
        </span>
        <h1>Confirmação de Presença</h1>
        <p class="mensagem {% if success %}msg-ok{% else %}msg-erro{% endif %}">{{ mensagem }}</p>
        <p class="linha"><strong>Atividade:</strong> {{ inscricao.atividade.titulo }}</p>
        <p class="linha"><strong>Participante:</strong> {{ inscricao.participante.first_name }} {{ inscricao.participante.last_name }}</p>
        <a href="{% url 'participante:dashboard' %}" class="btn-app">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Ir para o painel
        </a>
    </div>
</body>
</html>
