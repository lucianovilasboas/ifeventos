{% extends 'base.html' %}

{% block title %}Redefinição de Senha{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="login-container">
        <h2><i class="fa-solid fa-key"></i> Redefinição de Senha</h2>
        <p class="text-muted">Digite seu e-mail e enviaremos um link para redefinir sua senha.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-app w-100 py-2">Enviar link</button>
        </form>
    </div>
</div>
{% endblock %}
