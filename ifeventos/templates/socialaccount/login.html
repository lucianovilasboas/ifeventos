{% extends "base.html" %}

{% load i18n %}

{% block content %}
<div class="container my-5">
    <div class="login-container">
        <h2><i class="fa-brands fa-google"></i> Login com Google</h2>
        <p class="text-muted">Você está prestes a fazer login usando sua conta do Google.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-app-green w-100 py-2">
                <i class="fa-brands fa-google"></i> Continuar
            </button>
        </form>
        <div class="extra-links">
            <p><a href="{% url 'account_login' %}">← Voltar para o login</a></p>
        </div>
    </div>
</div>
{% endblock %}
